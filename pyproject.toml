[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-query-contract"
dynamic = ["version"]
description = "A query-capture engine for Django, and a pytest plugin over it: normalised SQL fingerprints, call sites, and an honest report above Django's query-log ceiling."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Artur Veres", email = "artur8118@gmail.com" },
]
keywords = ["django", "testing", "pytest", "performance", "n-plus-one", "query-count"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # 4.2 because it is the oldest Django still receiving security fixes, and
    # nothing the capture reads was added after it: ``connection.execute_wrapper``
    # has taken the same five-argument wrapper since 2.0, and ``queries_limit``
    # has been on the base wrapper for longer still. Raise it only when the
    # capture needs a newer API, never on age.
    "django>=4.2",
]

# No ``pytest`` dependency, and that is a decision rather than an oversight. The
# pytest plugin is one of four faces of this capture -- the others being a CI
# report, call-site attribution and a runtime budget middleware -- and it is
# loaded through the ``pytest11`` entry point below, which only pytest itself
# ever reads. Declaring pytest as a runtime dependency would drag a test runner
# into the process of every consumer running the middleware face in production,
# to buy an import that is already guaranteed present wherever it matters.
[project.entry-points.pytest11]
django_query_contract = "django_query_contract.plugin"

[project.urls]
Homepage = "https://github.com/Artui/django-query-contract"
Repository = "https://github.com/Artui/django-query-contract"
Issues = "https://github.com/Artui/django-query-contract/issues"

[dependency-groups]
dev = [
    "ruff>=0.14.0",
    "ty>=0.0.32",
    "pre-commit>=4.0.0",
    "pytest>=8.0.0",
    # The composition target. This package ships no count assertion; it
    # diagnoses pytest-django's, so pytest-django is what the suite has to be
    # written against rather than around.
    "pytest-django>=4.9.0",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.24.0",
    # Backs the ``TID`` rule selection below; ruff reads its settings from the
    # flake8-tidy-imports namespace and the plugin is what defines them.
    "flake8-tidy-imports>=4.12.0",
    "django-stubs>=5.1.0",
    # Plan capture is PostgreSQL-only, so the suite needs a driver to reach the
    # one backend that can produce a plan at all. Dev-group rather than an extra
    # of its own: the package issues ``EXPLAIN`` through whatever driver the
    # connection already has and imports neither psycopg nor psycopg2, so there
    # is nothing for a consumer to install beyond the driver they were always
    # going to have.
    "psycopg[binary]>=3.2.0",
    # The database a plan assertion is only honest against. A plan over ten rows
    # is a lie, so the Postgres-only tests build a shaped, analyzed world with
    # the package that exists to build one rather than looping over
    # ``objects.create`` and measuring the wrong database.
    "django-data-shape[pytest]>=0.7.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["django_query_contract"]

[tool.hatch.version]
path = "django_query_contract/version.py"
# Hatchling's default regex expects a bare ``__version__ = "..."``. This file
# annotates the assignment, so the pattern has to allow the annotation or the
# build cannot find the version at all -- and the failure is total: every uv
# command reports "unable to parse the version from the file".
pattern = "^__version__(?:\\s*:\\s*[A-Za-z][A-Za-z0-9_]*)?\\s*=\\s*[\"'](?P<version>[^\"']+)[\"']"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.conftest_settings"
asyncio_mode = "auto"
testpaths = ["tests"]
# The coverage gate rides on the default run, and the default run is SQLite.
# Almost everything this package ships is backend-neutral: the capture is
# ``execute_wrapper``, the fingerprint is a string transform, and the ceiling is
# arithmetic over ``connection.queries_limit``. Plan capture is PostgreSQL-only
# and stays covered here because every refusal branches on the connection's
# *vendor* and every plan is parsed from a payload -- a refusal reachable only on
# the backend it refuses is a refusal the gating job cannot see. What that cannot
# check is whether a real server accepts what this package sends, which is what
# the separate ``postgres`` CI job is for.
#
# ``-p no:django_query_contract`` disables this package's own pytest plugin for its
# own suite, and it is load-bearing rather than shy. pytest imports entry-point
# plugins before pytest-cov starts measuring, so with the plugin enabled every
# module it pulls in at import time -- which is all of them -- is already loaded
# when coverage begins, and coverage reports each one at 0% for lines that in
# fact ran. The hooks are covered instead by ``tests/test_plugin.py``, which
# runs pytest inside pytest with the plugin on, and by
# ``tests/test_plugin_hooks.py``, which drives each hook directly with real
# pytest objects. Removing this flag does not make the suite dogfood the plugin;
# it makes the coverage gate stop measuring the package.
addopts = "-p no:django_query_contract --cov=django_query_contract --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["django_query_contract"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 100

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I", "TID"]
ignore = ["E203", "E501", "E231", "F811", "E722", "E741", "UP040", "UP046", "UP047"]

[tool.ruff.lint.per-file-ignores]
# I002 exempts the two file kinds that must not carry the future import: a
# re-export ``__init__.py`` has no annotations to postpone, and migrations are
# generated by Django, so the import would be dropped on every makemigrations.
"__init__.py" = ["F401", "I002"]
"**/migrations/*.py" = ["I002"]

[tool.ruff.lint.isort]
known-first-party = ["django_query_contract"]
# CLAUDE.md requires this at the top of every annotated file; required-imports
# is what enforces it rather than leaving it to memory.
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.flake8-tidy-imports]
# CLAUDE.md forbids every relative form, including single-dot. TID's default is
# "parents", which lets ``from .foo import bar`` through.
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ty.environment]
root = ["./django_query_contract"]

[tool.bumpversion]
current_version = "0.6.0"
allow_dirty = false
commit = false
tag = false

[[tool.bumpversion.files]]
filename = "django_query_contract/version.py"
search = '__version__: str = "{current_version}"'
replace = '__version__: str = "{new_version}"'

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "## [Unreleased]"
replace = """## [Unreleased]

## [{new_version}] — {now:%Y-%m-%d}"""

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "[Unreleased]: https://github.com/Artui/django-query-contract/compare/v{current_version}...HEAD"
replace = """[Unreleased]: https://github.com/Artui/django-query-contract/compare/v{new_version}...HEAD
[{new_version}]: https://github.com/Artui/django-query-contract/compare/v{current_version}...v{new_version}"""
